name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    env:
      BB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/bb-plugin-copilot-session-credits/package-lock.json
      - name: Install host tools for tests, not for package consumers
        run: npm install --global bb-app@0.48.1 @earendil-works/pi-coding-agent@1.5.0
      - run: npm --prefix packages/bb-plugin-copilot-session-credits ci
      # Includes TypeScript, actual BB build, accounting, host, UI, Pi SDK and isolated pinned Git package install/remove and Pi loader tests.
      - run: npm test
